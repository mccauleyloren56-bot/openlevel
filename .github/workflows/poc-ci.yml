name: OpenLevel POC Baseline

on:
  push:
    branches:
      - poc-business-follow-up
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Install, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The upstream fork currently carries invalid npm integrity hashes in its
      # package-lock.json. Keep the inherited file untouched for auditability,
      # but bypass it in this proof-of-concept run so we can test the application.
      # A clean lockfile must be regenerated and reviewed before production.
      - name: Install dependencies without inherited corrupt lockfile
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
